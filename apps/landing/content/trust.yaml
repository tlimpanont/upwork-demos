overline: Why this matters
heading: Demos that ship, not toys
points:
  - icon: verified
    title: Production-ready architecture
    body: >-
      Each demo uses the same patterns we ship to paying customers: typed APIs,
      server actions, audit-grade auth, and proper error handling.
  - icon: trendingUp
    title: Built for scalability
    body: >-
      Serverless by default. Postgres scales to millions of rows, Pinecone to
      billions of vectors, and Vercel handles the traffic spikes for you.
  - icon: rocketLaunch
    title: Used for real SaaS products
    body: >-
      These aren't tutorial apps. The same building blocks power live products —
      auth, billing, multi-tenant data, and AI workflows that earn revenue.