overline: Business solutions
heading: What I build for enterprise teams
intro: >-
  Production-ready systems that automate operations, surface decisions, and
  scale with the organization. Direct contact with the architect — no PMs in
  the middle, no junior on the keyboard.
items:
  - title: AI Automation Systems
    body: >-
      I automate invoice processing, document handling, customer support, and
      operational workflows so your team focuses on judgement, not data entry.
    bullets:
      - Structured extraction from PDFs and forms
      - Document classification and routing
      - Customer-support copilots with grounded answers
      - End-to-end workflow orchestration
    icon: automation
  - title: Custom SaaS Platforms
    body: >-
      I build secure, scalable multi-tenant platforms, portals, and
      subscription applications — from auth and billing to dashboards.
    bullets:
      - Multi-tenant data with audit-grade isolation
      - Stripe billing, RBAC, workspace admin
      - Customer-facing dashboards and portals
      - Cloud deployment with monitoring
    icon: layers
  - title: Computer Vision Applications
    body: >-
      I develop AI solutions for quality inspection, anomaly detection, and
      visual monitoring across manufacturing, energy, and healthcare imagery.
    bullets:
      - Open-vocabulary anomaly localization
      - Annotation pipelines with human-in-the-loop
      - Heatmap + bounding-box review UIs
      - Edge or cloud deployment paths
    icon: vision
  - title: Data Analytics Dashboards
    body: >-
      Executive dashboards for KPI tracking, forecasting, and operational
      insights — backed by your existing data warehouse or operational stores.
    bullets:
      - Real-time KPIs with drill-down
      - Forecasting + anomaly callouts
      - Role-based access and export
      - GraphQL or REST APIs for downstream use
    icon: analytics
  - title: ERP and API Integrations
    body: >-
      I connect SAP, Microsoft Dynamics, Exact Online, HubSpot, Salesforce,
      and custom systems with reliable, monitored integrations.
    bullets:
      - Two-way sync with idempotent retries
      - Schema-typed adapters per system
      - Audit log of every payload
      - Webhook + scheduled-job orchestration
    icon: integration
  - title: Predictive AI Systems
    body: >-
      Predictive maintenance, fraud detection, demand forecasting, and risk
      models — trained on your data and deployed with monitoring.
    bullets:
      - Feature pipelines from sensor / transaction data
      - Model training + evaluation harness
      - Drift detection and retraining schedule
      - Real-time inference behind your API
    icon: predictive
