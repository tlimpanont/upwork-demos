overline: About
heading: A senior engineering partner, not an agency layer
body: >-
  I help organizations design and build advanced AI and software solutions
  that automate operations, improve decision-making, and create scalable
  digital products. You work directly with the architect — no PMs in the
  middle, no junior on the keyboard, no translation layer between
  requirements and code. When a project benefits from extra capacity, I
  bring in trusted specialists from my network and tell you exactly who's
  involved.
bullets:
  - 10+ years shipping enterprise software end-to-end
  - Production AI systems in invoice processing, computer vision, predictive maintenance
  - EU-region deployments available (Hetzner, AWS eu-central, Mistral)
  - Hand-off documentation from day one — no vendor lock-in baked into the architecture
